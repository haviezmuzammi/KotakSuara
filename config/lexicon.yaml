  "azza wa jalla": "عَزَّ وَجَلَّ"
  "tabaraka wa ta'ala": "تَبَارَكَ وَتَعَالَى"
  "jalla jalaluh": "جَلَّ جَلَالُهُ"
  "'alaihissalam": "عَلَيْهِ السَّلَامُ"
  "'alaihimassalam": "عَلَيْهِمَا السَّلَامُ"
  "'alaihimussalam": "عَلَيْهِمُ السَّلَامُ"
  "radhiyallahu 'anhu": "رَضِيَ اللهُ عَنْهُ"
  "radhiyallahu 'anha": "رَضِيَ اللهُ عَنْهَا"
  "radhiyallahu 'anhuma": "رَضِيَ اللهُ عَنْهُمَا"
  "radhiyallahu 'anhum": "رَضِيَ اللهُ عَنْهُمْ"
